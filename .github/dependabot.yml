version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: weekly
  commit-message:
    prefix: "ci(github-actions)"
  cooldown:
    default-days: 3
  groups:
    github-actions:
      applies-to: version-updates
      patterns:
      - "*"
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
  cooldown:
    default-days: 3
    exclude:
    - "@ui5/*"
    - "less-openui5"
  versioning-strategy: increase
  commit-message:
    prefix: "deps"
    prefix-development: "build(deps-dev)"
  groups:
    npm:
      dependency-type: production
      update-types:
      - minor
      - patch
    npm-dev:
      dependency-type: development
      update-types:
      - minor
      - patch

  ignore:
    - dependency-name: "@types/node" # Should be manually kept in sync with the minimum supported Node.js version

    # Major updates of dependencies that require a newer minimum Node.js version
    # are blocked and can't be merged right now.
    # Re-visit this list when the minimum supported Node.js version is increased.
    - dependency-name: "@commitlint/cli"
      update-types: ["version-update:semver-major"]
    - dependency-name: "@commitlint/config-conventional"
      update-types: ["version-update:semver-major"]
    - dependency-name: "@eslint/js"
      update-types: ["version-update:semver-major"]
    - dependency-name: "ava"
      update-types: ["version-update:semver-major"]
    - dependency-name: "eslint-plugin-ava"
      update-types: ["version-update:semver-major"]
    - dependency-name: "eslint"
      update-types: ["version-update:semver-major"]
    - dependency-name: "execa"
      update-types: ["version-update:semver-major"]
    - dependency-name: "make-fetch-happen"
      update-types: ["version-update:semver-major"]

    # TypeScript 7.x upgrade is blocked, see https://github.com/UI5/mcp-server/issues/422
    - dependency-name: "typescript"
      update-types: ["version-update:semver-major"]
